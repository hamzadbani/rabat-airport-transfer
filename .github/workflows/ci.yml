name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip, intl
          tools: composer:v2

      - name: Install dependencies & build assets
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          printf 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\nAPP_ENV=testing\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\n' > .env
          npm ci
          npm run build
          php artisan package:discover --ansi

      - name: Run tests
        working-directory: backend
        run: php artisan test
