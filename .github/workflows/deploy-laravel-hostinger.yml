name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip, intl
          tools: composer:v2

      - name: Install & build Laravel
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          printf 'APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\nAPP_ENV=production\n' > .env
          npm ci
          npm run build
          php artisan package:discover --ansi
          php artisan view:cache
          rm -f .env

      - name: Deploy Laravel app (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          local-dir: ./backend/
          exclude: |
            **/.git*
            **/.env
            **/.env.*
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/storage/**
            **/bootstrap/cache/**
            **/database/database.sqlite
