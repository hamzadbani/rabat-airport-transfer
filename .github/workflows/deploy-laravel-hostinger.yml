name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build frontend assets
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Deploy Laravel app (FTP, without vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          local-dir: ./backend/
          state-name: hostinger-laravel-ftp
          log-level: minimal
          exclude: |
            **/.git*
            **/.env
            **/.env.*
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/storage/**
            **/bootstrap/cache/**
            **/database/database.sqlite

      - name: Install Composer dependencies on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script_stop: true
          script: |
            DEPLOY_DIR="${{ secrets.HOSTINGER_SSH_DIR }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/public_html"
            fi
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Deploy directory not found: $DEPLOY_DIR"
              echo "Home contents:"
              ls -la "$HOME" || true
              ls -la "$HOME/public_html" 2>/dev/null || true
              exit 1
            fi
            echo "Using deploy directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction
            else
              php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction
            fi
            php artisan package:discover --ansi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
