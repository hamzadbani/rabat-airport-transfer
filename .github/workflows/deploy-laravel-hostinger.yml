name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build frontend assets
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Deploy Laravel app (FTP, without vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}
          local-dir: ./backend/
          state-name: hostinger-laravel-ftp
          log-level: minimal
          exclude: |
            **/.git*
            **/.env
            **/.env.*
            **/vendor/**
            **/node_modules/**
            **/tests/**
            **/.env.example
            **/storage/**
            **/bootstrap/cache/**
            **/database/database.sqlite

      - name: Install Composer dependencies on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        env:
          SSH_DEPLOY_DIR: ${{ secrets.HOSTINGER_SSH_DIR }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          envs: SSH_DEPLOY_DIR
          script_stop: true
          script: |
            set -e
            resolve_deploy_dir() {
              candidate="$1"
              if [ -n "$candidate" ] && [ -d "$candidate" ]; then
                printf '%s' "$candidate"
                return 0
              fi
              if [ -n "$candidate" ]; then
                relative="${candidate#/}"
                if [ -d "$HOME/$relative" ]; then
                  printf '%s' "$HOME/$relative"
                  return 0
                fi
              fi
              if [ -d "$HOME/public_html" ]; then
                printf '%s' "$HOME/public_html"
                return 0
              fi
              return 1
            }
            DEPLOY_DIR="$(resolve_deploy_dir "$SSH_DEPLOY_DIR")" || {
              echo "Could not resolve deploy directory."
              echo "SSH_DEPLOY_DIR=${SSH_DEPLOY_DIR:-<empty>}"
              echo "HOME=${HOME:-<empty>}"
              ls -la "$HOME" || true
              exit 1
            }
            echo "Using deploy directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction
            else
              php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction
            fi
            php artisan package:discover --ansi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
