services:
  mysql:
    image: mysql:8.0
    container_name: rat-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taxi_rabat
      MYSQL_USER: taxi
      MYSQL_PASSWORD: taxi_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - rat_mysql_data:/var/lib/mysql
    networks:
      - rat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rat-laravel
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rat-network
    user: root
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s

  nginx:
    image: nginx:1.27-alpine
    container_name: rat-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - rat-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rat-mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - rat-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: rat-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: taxi
      PMA_PASSWORD: taxi_secret
    ports:
      - "8083:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rat-network

  # Legacy PHP email stub (optional local contact testing)
  php-legacy:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: rat-php-legacy
    ports:
      - "9090:80"
    volumes:
      - ./php:/var/www/html
    depends_on:
      - mailhog
    networks:
      - rat-network

volumes:
  rat_mysql_data:

networks:
  rat-network:
    driver: bridge
