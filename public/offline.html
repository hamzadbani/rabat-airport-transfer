<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>Hors ligne — Rabat Transfert</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e3a5f);
      color: #f8fafc;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 12px; font-weight: 700; }
    p { margin: 0 0 24px; line-height: 1.5; color: #cbd5e1; font-size: 0.95rem; max-width: 22rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 12px;
      background: #0d9488;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:active { filter: brightness(0.95); }
  </style>
</head>
<body>
  <div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet, puis réessayez.</p>
    <a href="/">Réessayer</a>
  </div>
</body>
</html>
